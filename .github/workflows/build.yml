name: 编译 ROM 规则合并

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.12+7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: 安装固定版本 Android 工具
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "ANDROID_NDK_HOME=$env:ANDROID_HOME/ndk/27.3.13750724" >> $env:GITHUB_ENV
      - name: 从源码编译两个 ARM64 工具
        run: python build_native.py
      - name: 准备原发布签名
        env:
          ROMPOLICY_JKS_BASE64: ${{ secrets.ROMPOLICY_JKS_BASE64 }}
        run: python scripts/prepare_signing.py
      - name: 编译 APK 并核对完整 MD5 和 SHA-256
        env:
          ROMPOLICY_STORE_PASSWORD: ${{ secrets.ROMPOLICY_STORE_PASSWORD }}
          ROMPOLICY_KEY_PASSWORD: ${{ secrets.ROMPOLICY_KEY_PASSWORD }}
        run: python build_apk.py
      - name: 上传 APK 和校验文件
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROMPolicyMerge-v1.0.5-arm64
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/checksums.json
            dist/SHA256SUMS.txt
      - name: 显示校验值
        shell: pwsh
        run: |
          Get-Content dist/checksums.json >> $env:GITHUB_STEP_SUMMARY
          "Artifact SHA-256: ${{ steps.artifact.outputs.artifact-digest }}" >> $env:GITHUB_STEP_SUMMARY
      - name: 清理临时签名密钥
        if: always()
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'rompolicy-release.jks'
          if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
